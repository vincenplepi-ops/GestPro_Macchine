name: Build GestPro Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent GestPro signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gestpro-release-key.jks"
          echo "GESTPRO_KEYSTORE_PATH=$RUNNER_TEMP/gestpro-release-key.jks" >> "$GITHUB_ENV"
          echo "GESTPRO_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "GESTPRO_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "GESTPRO_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Read Android version
        id: app_version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-app/app/build.gradle | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build signed installable APK
        run: gradle -p android-app assembleRelease --no-daemon

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/release/app-release.apk GestPro-Macchine-Mobile-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestPro-Macchine-Mobile-Android
          path: GestPro-Macchine-Mobile-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.app_version.outputs.version }}
        shell: bash
        run: |
          TAG="android-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" GestPro-Macchine-Mobile-Android.apk --clobber
          else
            gh release create "$TAG" GestPro-Macchine-Mobile-Android.apk \
              --target "$GITHUB_SHA" \
              --title "GestPro Macchine Android v${VERSION}" \
              --notes "Nuova installazione Android con chiave permanente e scanner web stabile. Disinstallare la versione 1.0.5 prima dell'installazione."
          fi
