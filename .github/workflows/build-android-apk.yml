name: Build GestPro Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gestpro-android-debug-keystore-v1

      - name: Ensure stable Android signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=GestPro Android, OU=VP Software, O=VP Software, L=Prato, ST=Toscana, C=IT"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Read Android version
        id: app_version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-app/app/build.gradle | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build installable APK
        run: gradle -p android-app assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk GestPro-Macchine-Mobile-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestPro-Macchine-Mobile-Android
          path: GestPro-Macchine-Mobile-Android.apk
          if-no-files-found: error
          retention-days: 30

      # Pubblicazione APK automatica volutamente sospesa:
      # gli aggiornamenti di GestPro sono distribuiti dal sito Vercel condiviso
      # finché non viene configurata una chiave di firma Android permanente.
